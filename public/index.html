<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>HairEvolution — BarberApp</title>

<!-- Rende l'app "installabile" come scorciatoia sulla schermata Home,
     aprendosi a schermo intero senza la barra del browser -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HairEvolution by BarberApp">
<meta name="application-name" content="HairEvolution by BarberApp">
<meta name="theme-color" content="#1c1c1c">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231c1c1c'/%3E%3Ctext x='50' y='62' font-size='46' font-family='Georgia,serif' fill='%23d4af6a' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231c1c1c'/%3E%3Ctext x='50' y='62' font-size='46' font-family='Georgia,serif' fill='%23d4af6a' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --charcoal:#1c1c1c;
    --charcoal-2:#2a2926;
    --cream:#f6f1e7;
    --cream-2:#efe8d8;
    --gold:#b8912f;
    --gold-light:#d4af6a;
    --oxblood:#7a2e2e;
    --oxblood-light:#f5e6e1;
    --sage:#4f7358;
    --sage-light:#e6ede4;
    --grey:#4a4a4a;
    --grey-light:#8a8578;
    --line:#e3ddcd;
    --white:#fffdf9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--charcoal);
    font-family:'Inter',sans-serif;
    color:var(--charcoal);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:0;
  }
  #app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    background:var(--cream);
    position:relative;
    box-shadow:0 0 60px rgba(0,0,0,0.4);
    display:flex;
    flex-direction:column;
  }
  /* ---------- Header ---------- */
  header{
    background:var(--charcoal);
    color:var(--cream);
    padding:22px 20px 0 20px;
    position:relative;
  }
  .brand{
    text-align:center;
    padding-bottom:14px;
  }
  .brand h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:28px;
    margin:0;
    letter-spacing:0.2px;
    display:inline-block;
  }
  .beta-badge{
    display:inline-block;
    background:var(--gold);
    color:var(--charcoal);
    font-family:'Inter',sans-serif;
    font-size:10px;
    font-weight:700;
    letter-spacing:.5px;
    padding:3px 8px;
    border-radius:999px;
    vertical-align:middle;
    margin-left:8px;
    position:relative;
    top:-4px;
  }
  .beta-banner{
    background:#3a2f1a;
    color:var(--gold-light);
    font-size:11px;
    text-align:center;
    padding:8px 14px;
    line-height:1.4;
  }
  .brand .slogan{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:500;
    color:var(--gold-light);
    font-size:13px;
    margin-top:2px;
  }
  .brand .meta{
    font-size:11px;
    color:#c9c4b6;
    margin-top:6px;
  }
  .gold-rule{
    height:2px;
    background:linear-gradient(90deg, transparent, var(--gold) 15%, var(--gold) 85%, transparent);
  }
  /* segmented control */
  .segmented{
    display:flex;
    gap:0;
    background:var(--charcoal-2);
    border-radius:999px;
    padding:4px;
    margin:16px 0;
  }
  .segmented button{
    flex:1;
    border:none;
    background:transparent;
    color:#c9c4b6;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    padding:10px 8px;
    border-radius:999px;
    cursor:pointer;
    transition:all .25s ease;
    letter-spacing:.2px;
  }
  .segmented button.active{
    background:var(--gold);
    color:var(--charcoal);
  }
  /* ---------- Body scroll area ---------- */
  main{
    flex:1;
    overflow-y:auto;
    padding:18px 20px 100px 20px;
  }
  .section-label{
    font-size:11.5px;
    font-weight:700;
    letter-spacing:1.2px;
    color:var(--charcoal);
    border-bottom:1.5px solid var(--gold);
    padding-bottom:6px;
    margin:22px 0 12px 0;
  }
  .section-label:first-child{margin-top:0;}

  /* date chips */
  .date-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:6px;
    scrollbar-width:none;
  }
  .date-row::-webkit-scrollbar{display:none;}
  .date-chip{
    flex:0 0 auto;
    background:var(--white);
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:9px 12px;
    text-align:center;
    cursor:pointer;
    min-width:54px;
    transition:all .2s ease;
  }
  .date-chip .dow{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.5px;
    color:var(--grey-light);
    font-weight:600;
  }
  .date-chip .dnum{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:18px;
    color:var(--charcoal);
    margin-top:2px;
  }
  .date-chip.active{
    background:var(--charcoal);
    border-color:var(--charcoal);
  }
  .date-chip.active .dow{color:var(--gold-light);}
  .date-chip.active .dnum{color:var(--cream);}
  .date-chip.closed{
    background:var(--cream-2);
    opacity:.55;
    cursor:not-allowed;
  }
  .date-chip.closed .dnum{
    color:var(--grey-light);
    text-decoration:line-through;
  }
  .date-chip .dclosed{
    font-size:8.5px;
    text-transform:uppercase;
    letter-spacing:.3px;
    color:var(--oxblood);
    font-weight:700;
    margin-top:2px;
  }

  /* service categories */
  .cat-tabs{
    display:flex;
    gap:6px;
    margin-bottom:10px;
  }
  .cat-tab{
    flex:1;
    text-align:center;
    padding:8px 4px;
    font-size:11px;
    font-weight:700;
    letter-spacing:.6px;
    border:1.5px solid var(--line);
    background:var(--white);
    border-radius:10px;
    cursor:pointer;
    color:var(--grey);
  }
  .cat-tab.active{
    background:var(--gold);
    border-color:var(--gold);
    color:var(--charcoal);
  }
  .service-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .service-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--white);
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    cursor:pointer;
    transition:all .18s ease;
  }
  .service-item.selected{
    border-color:var(--gold);
    background:#fbf6ea;
  }
  .service-item .s-name{
    font-size:14px;
    font-weight:600;
    color:var(--charcoal);
  }
  .service-item .s-dur{
    font-size:11px;
    color:var(--grey-light);
    font-style:italic;
    margin-top:2px;
  }
  .service-item .s-price{
    font-family:'Fraunces',serif;
    font-weight:600;
    color:var(--gold);
    font-size:15px;
    white-space:nowrap;
  }

  /* time slots */
  .slot-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
  }
  .time-sublabel{
    font-size:11px;
    font-weight:700;
    color:var(--gold);
    letter-spacing:.6px;
    margin:10px 0 8px 0;
  }
  .time-sublabel:first-of-type{margin-top:0;}
  .slot{
    padding:10px 4px;
    text-align:center;
    border-radius:9px;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    border:1.5px solid transparent;
  }
  .slot.free{
    background:var(--sage-light);
    color:var(--sage);
    border-color:#cfe0d1;
  }
  .slot.free:hover{border-color:var(--sage);}
  .slot.busy{
    background:var(--oxblood-light);
    color:var(--oxblood);
    opacity:.7;
    cursor:not-allowed;
  }
  .slot.pausa{
    background:#f5ecd9;
    color:#8a6a1f;
    border-color:#e0c98a;
    opacity:.85;
    cursor:not-allowed;
    font-size:11px;
    font-weight:700;
    letter-spacing:.3px;
  }
  .slot.picked{
    background:var(--charcoal);
    color:var(--gold-light);
    border-color:var(--charcoal);
  }
  .empty-note{
    font-size:12.5px;
    color:var(--grey-light);
    font-style:italic;
    padding:10px 2px;
  }
  .closed-note{
    background:var(--oxblood-light);
    color:var(--oxblood);
    padding:12px 14px;
    border-radius:10px;
    font-size:13px;
    font-weight:600;
  }

  /* legend */
  .legend{
    display:flex;
    gap:16px;
    font-size:11px;
    color:var(--grey);
    margin-top:10px;
  }
  .legend span{display:flex;align-items:center;gap:5px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .dot.free{background:var(--sage);}
  .dot.busy{background:var(--oxblood);}
  .dot.pausa{background:#c9a227;}

  /* summary bar */
  .summary-bar{
    position:sticky;
    bottom:0;
    background:var(--white);
    border-top:1.5px solid var(--line);
    padding:12px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    box-shadow:0 -4px 16px rgba(0,0,0,0.05);
  }
  .summary-bar .sum-text{
    font-size:12.5px;
    color:var(--grey);
    line-height:1.4;
  }
  .summary-bar .sum-text b{color:var(--charcoal);}
  .btn-primary{
    background:var(--charcoal);
    color:var(--gold-light);
    border:none;
    padding:12px 18px;
    border-radius:10px;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn-primary:disabled{
    background:#c9c4b6;
    color:#fff;
    cursor:not-allowed;
  }

  /* form / modal */
  .sheet-overlay{
    position:absolute;
    inset:0;
    background:rgba(28,28,28,0.55);
    display:flex;
    align-items:flex-end;
    z-index:20;
  }
  .sheet{
    background:var(--cream);
    width:100%;
    border-radius:20px 20px 0 0;
    padding:22px 22px 26px 22px;
    animation:slideup .25s ease;
  }
  @keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet h3{
    font-family:'Fraunces',serif;
    font-size:19px;
    margin:0 0 4px 0;
  }
  .sheet .sheet-sub{
    font-size:12.5px;
    color:var(--grey-light);
    margin-bottom:16px;
  }
  .field{margin-bottom:12px;}
  .field label{
    font-size:11.5px;
    font-weight:700;
    color:var(--grey);
    letter-spacing:.3px;
    display:block;
    margin-bottom:5px;
  }
  .field input{
    width:100%;
    padding:11px 12px;
    border-radius:9px;
    border:1.5px solid var(--line);
    background:var(--white);
    font-family:'Inter',sans-serif;
    font-size:14px;
  }
  .field input:focus{outline:none;border-color:var(--gold);}
  .privacy-note{
    font-size:11px;
    color:var(--grey-light);
    line-height:1.5;
    margin:2px 0 12px 0;
  }
  .privacy-check{
    display:flex;
    align-items:flex-start;
    gap:8px;
    font-size:12px;
    color:var(--grey);
    line-height:1.4;
    cursor:pointer;
    margin-bottom:6px;
  }
  .privacy-check input{
    margin-top:2px;
    flex:0 0 auto;
  }
  .sheet-actions{
    display:flex;
    gap:10px;
    margin-top:18px;
  }
  .btn-secondary{
    flex:0 0 auto;
    background:transparent;
    border:1.5px solid var(--line);
    color:var(--grey);
    padding:12px 16px;
    border-radius:10px;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .changelog-scroll{
    max-height:50vh;
    overflow-y:auto;
    margin-top:4px;
  }
  .changelog-entry{
    padding:12px 0;
    border-bottom:1px dashed var(--line);
  }
  .changelog-entry:last-child{border-bottom:none;}
  .changelog-version{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:15px;
    color:var(--charcoal);
  }
  .changelog-date{
    font-family:'Inter',sans-serif;
    font-weight:400;
    font-size:11px;
    color:var(--grey-light);
    margin-left:6px;
  }
  .changelog-summary{
    font-size:12px;
    color:var(--grey);
    line-height:1.55;
    margin:5px 0 6px 0;
    font-style:italic;
  }
  .changelog-list{
    margin:6px 0 0 0;
    padding-left:18px;
    font-size:12.5px;
    color:var(--grey);
    line-height:1.6;
  }
  .summary-entry{
    padding:10px 0;
    border-bottom:1px dashed var(--line);
  }
  .summary-entry:last-child{border-bottom:none;}
  .summary-title{
    font-weight:700;
    font-size:12.5px;
    color:var(--charcoal);
    margin-bottom:3px;
  }
  .summary-text{
    font-size:12px;
    color:var(--grey);
    line-height:1.5;
  }

  /* confirmation screen */
  .confirm-screen{
    text-align:center;
    padding:30px 6px;
  }
  .confirm-icon{
    width:56px;height:56px;border-radius:50%;
    background:var(--sage-light);
    color:var(--sage);
    display:flex;align-items:center;justify-content:center;
    font-size:26px;
    margin:0 auto 16px auto;
  }
  .confirm-screen h3{
    font-family:'Fraunces',serif;
    font-size:21px;
    margin:0 0 6px 0;
  }
  .confirm-detail{
    background:var(--white);
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:16px;
    text-align:left;
    font-size:13.5px;
    margin:18px 0;
    line-height:1.9;
  }
  .confirm-detail b{color:var(--charcoal);}
  .reminder-list{
    text-align:left;
    font-size:12.5px;
    color:var(--grey);
    margin:14px 0;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .reminder-list div{display:flex;gap:8px;align-items:flex-start;}
  .wa-btn{
    display:block;
    width:100%;
    background:#25D366;
    color:white;
    text-decoration:none;
    padding:13px;
    border-radius:10px;
    font-weight:700;
    font-size:13.5px;
    text-align:center;
    margin-top:6px;
  }
  .link-btn{
    background:none;
    border:none;
    color:var(--grey);
    text-decoration:underline;
    font-size:12.5px;
    margin-top:14px;
    cursor:pointer;
  }

  /* ---------- Owner view ---------- */
  .pin-screen{
    padding:60px 10px;
    text-align:center;
  }
  .pin-screen .lock{
    width:52px;height:52px;border-radius:50%;
    background:var(--charcoal);
    color:var(--gold-light);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;
    margin:0 auto 18px auto;
  }
  .pin-screen h3{font-family:'Fraunces',serif;font-size:19px;margin:0 0 6px 0;}
  .pin-screen p{font-size:12.5px;color:var(--grey-light);margin-bottom:18px;}
  .pin-input{
    width:160px;
    text-align:center;
    letter-spacing:8px;
    font-size:20px;
    padding:12px;
    border-radius:10px;
    border:1.5px solid var(--line);
    margin-bottom:10px;
  }
  .pin-hint{font-size:11px;color:var(--grey-light);margin-top:10px;}

  .owner-stats{
    display:flex;
    gap:10px;
    margin-bottom:18px;
  }
  .breaks-section{
    margin-bottom:22px;
  }
  .rubrica-section{
    margin-bottom:18px;
  }
  .contact-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--white);
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:8px;
  }
  .contact-name{
    font-weight:600;
    font-size:13.5px;
    color:var(--charcoal);
  }
  .contact-sub{
    font-size:11.5px;
    color:var(--grey-light);
    margin-top:2px;
  }
  .contact-invited{
    font-size:11px;
    color:var(--sage);
    margin-top:3px;
    font-weight:600;
  }
  .break-row{
    background:var(--white);
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:8px;
  }
  .break-row-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .break-title{
    font-weight:600;
    font-size:13.5px;
    color:var(--charcoal);
  }
  .break-toggle{
    position:relative;
    display:inline-block;
    width:40px;
    height:22px;
  }
  .break-toggle input{
    opacity:0;
    width:0;
    height:0;
  }
  .break-toggle-slider{
    position:absolute;
    cursor:pointer;
    inset:0;
    background:var(--line);
    border-radius:999px;
    transition:.2s;
  }
  .break-toggle-slider:before{
    position:absolute;
    content:"";
    height:16px;
    width:16px;
    left:3px;
    top:3px;
    background:white;
    border-radius:50%;
    transition:.2s;
  }
  .break-toggle input:checked + .break-toggle-slider{
    background:#c9a227;
  }
  .break-toggle input:checked + .break-toggle-slider:before{
    transform:translateX(18px);
  }
  .break-times{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--line);
    font-size:13px;
    color:var(--grey);
  }
  .break-times input[type="time"]{
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:6px 8px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    background:var(--white);
  }
  .stat-card{
    flex:1;
    background:var(--white);
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:12px;
    text-align:center;
  }
  .stat-card .stat-num{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:22px;
    color:var(--charcoal);
  }
  .stat-card .stat-label{
    font-size:10.5px;
    color:var(--grey-light);
    margin-top:2px;
    letter-spacing:.3px;
  }
  .booking-card{
    background:var(--white);
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:14px;
    margin-bottom:10px;
    position:relative;
  }
  .booking-card.new{border-color:var(--gold);background:#fbf6ea;}
  .booking-card .b-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }
  .booking-card .b-time{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:17px;
    color:var(--charcoal);
  }
  .booking-card .b-date{
    font-size:10.5px;
    color:var(--grey-light);
    text-transform:uppercase;
    letter-spacing:.4px;
  }
  .badge-new{
    background:var(--gold);
    color:var(--charcoal);
    font-size:9.5px;
    font-weight:700;
    padding:3px 8px;
    border-radius:999px;
    letter-spacing:.3px;
  }
  .booking-card .b-service{
    font-size:13px;
    color:var(--grey);
    margin-top:6px;
  }
  .booking-card .b-created{
    font-size:11px;
    color:var(--grey-light);
    font-style:italic;
    margin-top:3px;
  }
  .booking-card .b-client{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--line);
  }
  .booking-card .b-name{
    font-weight:600;
    font-size:13.5px;
    color:var(--charcoal);
  }
  .booking-card .b-phone{

function fmtEUR(n){ return "€" + n.toFixed(2).replace(".", ","); }

function pad(n){ return n<10 ? "0"+n : ""+n; }

function dateKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }

function isClosedDate(d){
  return SHOP.closedDays.includes(d.getDay()) || SHOP.closedDates.includes(dateKey(d));
}

function nextDays(openCount){
  // Returns a run of consecutive calendar days that includes at least
  // `openCount` open (bookable) days. Closed days (weekly or specific
  // dates) are kept in the list too, so they can be shown greyed out
  // instead of silently disappearing.
  const out = [];
  let d = new Date();
  let openFound = 0;
  let i = 0;
  while(openFound < openCount && i < 90){
    const cur = new Date(d);
    cur.setDate(d.getDate()+i);
    out.push(cur);
    if(!isClosedDate(cur)) openFound++;
    i++;
  }
  return out;
}

function slotsForDate(){
  // 15 min increments across two opening windows
  const slots = [];
  const push = (h,m) => slots.push(pad(h)+":"+pad(m));
  for(let h=8; h<13; h++){
    for(let m of [0,15,30,45]){
      if(h===8 && (m===0 || m===15)) continue; // opens 8:30
      if(h===12 && m===45) continue; // closes 12:30
      if(h===12 && m===30) continue; // last start leaves no room before close
      push(h,m);
    }
  }
  for(let h=15; h<19; h++){
    for(let m of [0,15,30,45]){
      push(h,m);
    }
  }
  return slots;
}

function slotToMinutes(s){
  const [h,m] = s.split(":").map(Number);
  return h*60+m;
}
function minutesToSlot(min){
  const h = Math.floor(min/60), m = min%60;
  return pad(h)+":"+pad(m);
}

function slotsOccupiedBy(startSlot, durMin){
  const startMin = slotToMinutes(startSlot);
  const count = Math.ceil(durMin/15);
  const out = [];
  for(let i=0;i<count;i++){
    out.push(minutesToSlot(startMin + i*15));
  }
  return out;
}

// Closing boundaries, with a 30-minute grace margin for the last booking of each window
const MORNING_START = 8*60+30;   // 8:30
const MORNING_CLOSE = 12*60+30;  // 12:30
const MORNING_CLOSE_GRACE = MORNING_CLOSE + 30; // 13:00
const EVENING_START = 15*60;     // 15:00
const EVENING_CLOSE = 19*60;     // 19:00
const EVENING_CLOSE_GRACE = EVENING_CLOSE + 30; // 19:30

// Se dateStr è la data di oggi, controlla che lo slot non sia già passato
// rispetto all'orario attuale del dispositivo.
function isPastSlot(dateStr, startSlot){
  const now = new Date();
  const todayKey = dateKey(now);
  if(dateStr !== todayKey) return false;
  const nowMin = now.getHours()*60 + now.getMinutes();
  return slotToMinutes(startSlot) <= nowMin;
}

function canFit(dateStr, startSlot, durMin){
  if(isPastSlot(dateStr, startSlot)) return false;

  const startMin = slotToMinutes(startSlot);
  const endMin = startMin + durMin;

  // Must start within a valid opening window, and finish within that
  // window's closing time plus a 30-minute grace margin.
  let windowCloseGrace;
  if(startMin >= MORNING_START && startMin < MORNING_CLOSE){
    windowCloseGrace = MORNING_CLOSE_GRACE;
  } else if(startMin >= EVENING_START && startMin < EVENING_CLOSE){
    windowCloseGrace = EVENING_CLOSE_GRACE;
  } else {
    return false;
  }
  if(endMin > windowCloseGrace) return false;

  // Must not overlap any existing booking that day.
  // Each booking blocks a whole number of 15-minute grid slots: the
  // duration is rounded down to the nearest 15 minutes, with a 15-minute
  // minimum (so even a 5-min service always blocks at least one slot).
  const dayBookings = state.bookings.filter(b => b.date === dateStr);
  for(const b of dayBookings){
    const svc = ALL_SERVICES.find(s=>s.id===b.serviceId);
    const bStart = slotToMinutes(b.time);
    const bDur = svc ? svc.dur : 30;
    const blockedMin = Math.max(15, Math.floor(bDur/15)*15);
    const bEndRounded = bStart + blockedMin;
    if(startMin < bEndRounded && endMin > bStart) return false;
  }
  return true;
}

const API_URL = "/api/bookings";
const STORAGE_KEY = "hairevolution_beta_bookings"; // fallback offline locale

function saveBookingsLocal(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.bookings));
  } catch(e) {
    console.warn("Impossibile salvare localmente:", e);
  }
}

function loadBookingsLocal(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e) {
    return [];
  }
}

// Carica le prenotazioni dal database condiviso. Se il server non risponde
// (es. app aperta come semplice file locale, senza Netlify Functions attive),
// usa la copia salvata localmente come rete di sicurezza.
async function fetchBookings(){
  try {
    const res = await fetch(API_URL, { method: "GET" });
    if(!res.ok) throw new Error("risposta non ok");
    const data = await res.json();
    state.bookings = data.bookings || [];
    saveBookingsLocal();

// Controlla se un dato slot (HH:MM) cade dentro una pausa attiva.
function isSlotOnBreak(slot){
  const min = slotToMinutes(slot);
  for(const key of ["morning","afternoon"]){
    const b = state.breaks[key];
    if(b && b.enabled){
      const bStart = slotToMinutes(b.start);
      const bEnd = slotToMinutes(b.end);
      if(min >= bStart && min < bEnd) return true;
    }
  }
  return false;
}

// Combina i clienti derivati dalle prenotazioni (con conteggio visite e
// ultima data) con quelli aggiunti manualmente dal titolare, deduplicando
// per numero di telefono.
function getCombinedContacts(){
  const map = new Map();
  const sorted = [...state.bookings].sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
  sorted.forEach(b=>{
    const key = toWhatsappNumber(b.phone);
    const existing = map.get(key);
    if(existing){
      existing.visits += 1;
      if(b.date > existing.lastDate) existing.lastDate = b.date;
    } else {
      map.set(key, { name:b.name, phone:b.phone, visits:1, lastDate:b.date, fromBooking:true });
    }
  });
  state.manualContacts.forEach(c=>{
    const key = toWhatsappNumber(c.phone);
    if(!map.has(key)){
      map.set(key, { name:c.name, phone:c.phone, visits:0, lastDate:null, fromBooking:false });
    }
  });
  return Array.from(map.values()).sort((a,b)=> (b.lastDate||"").localeCompare(a.lastDate||""));
}

function formatDateLong(d){
  return d.getDate()+" "+MONTHS[d.getMonth()];
}

function toWhatsappNumber(phone){
  // Normalizes an Italian phone number into the digits-only international
  // format wa.me expects, avoiding a duplicated "39" prefix if the client
  // already typed it (with or without a leading "+" or "00").
  let d = (phone || "").replace(/[^\d]/g, "");
  if(d.startsWith("0039")) d = d.slice(2);
  if(d.startsWith("39")) return d;
  if(d.startsWith("0")) d = d.slice(1);
  return "39" + d;
}

function formatDateShort(dateStr){
  if(!dateStr) return "";
  const d = new Date(dateStr+"T00:00:00");
  return d.getDate()+" "+MONTHS[d.getMonth()];
}

function formatCreatedAt(iso){
  if(!iso) return "";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "";
  const h = pad(d.getHours()), m = pad(d.getMinutes());
  return d.getDate()+" "+MONTHS[d.getMonth()]+" alle "+h+":"+m;
}

function renderRubricaSection(){
  const wrap = document.createElement("div");
  wrap.className = "rubrica-section";

  const labelRow = document.createElement("div");
  labelRow.style.display = "flex";
  labelRow.style.justifyContent = "space-between";
  labelRow.style.alignItems = "center";
  labelRow.innerHTML = `<div class="section-label" style="margin:22px 0 12px 0;">RUBRICA CLIENTI</div>`;
  const addBtn = document.createElement("button");
  addBtn.className = "link-btn";
  addBtn.textContent = "+ Aggiungi cliente";
  addBtn.onclick = () => { state.showAddContact = true; render(); };
  labelRow.appendChild(addBtn);
  wrap.appendChild(labelRow);

  const contacts = getCombinedContacts();

  if(contacts.length === 0){
    const empty = document.createElement("div");
    empty.className = "empty-note";
    empty.textContent = "Nessun cliente in rubrica ancora. I clienti che prenotano vengono aggiunti qui automaticamente, oppure puoi aggiungerne uno a mano.";
    wrap.appendChild(empty);
    return wrap;
  }

  contacts.forEach(c=>{
    const row = document.createElement("div");
    row.className = "contact-row";
    const subtitle = c.fromBooking
      ? `${c.visits} ${c.visits===1?'visita':'visite'} · ultima: ${formatDateShort(c.lastDate)}`
      : "Non ha ancora prenotato";
    const invitedKey = toWhatsappNumber(c.phone);
    const invitedDate = state.invitedLog[invitedKey];
    const invitedLine = invitedDate ? `<div class="contact-invited">✅ Invitato il ${formatDateShort(invitedDate)}</div>` : "";
    const inviteMsg = encodeURIComponent(`Ciao ${c.name}! Ti va di prenotare il tuo prossimo appuntamento da HairEvolution? Puoi farlo comodamente qui: ${SHOP.bookingLink}`);
    row.innerHTML = `
      <div>
        <div class="contact-name">${c.name}</div>
        <div class="contact-sub">${subtitle}</div>
        ${invitedLine}
      </div>
      <a class="icon-btn" target="_blank" rel="noopener" href="https://wa.me/${invitedKey}?text=${inviteMsg}">${invitedDate ? "Invita di nuovo" : "Invita"}</a>
    `;
    row.querySelector("a.icon-btn").addEventListener("click", () => {
      markInvited(c.phone);
    });
    wrap.appendChild(row);
  });

  return wrap;
}

function renderAddContactSheet(){
  const overlay = document.createElement("div");
  overlay.className = "sheet-overlay";
  overlay.onclick = (e) => { if(e.target===overlay){ state.showAddContact=false; render(); } };

  const sheet = document.createElement("div");
  sheet.className = "sheet";
  sheet.innerHTML = `
    <h3>Aggiungi cliente</h3>
    <div class="sheet-sub">Per invitarlo a prenotare, anche se non ha mai usato l'app prima</div>
    <div class="field">
      <label>Nome e cognome</label>
      <input id="ctName" type="text" placeholder="Es. Luca Bianchi" />
    </div>
    <div class="field">
      <label>Numero di telefono</label>
      <input id="ctPhone" type="tel" placeholder="Es. 333 1234567" />
    </div>
    <div class="sheet-actions">
      <button class="btn-secondary" id="ctCancel">Annulla</button>
      <button class="btn-primary" id="ctConfirm" style="flex:1;">Aggiungi</button>
    </div>
  `;
  overlay.appendChild(sheet);

  sheet.querySelector("#ctCancel").onclick = () => { state.showAddContact=false; render(); };
  sheet.querySelector("#ctConfirm").onclick = async () => {
    const name = sheet.querySelector("#ctName").value.trim();
    const phone = sheet.querySelector("#ctPhone").value.trim();
    if(!name || !phone){
      flashToast("Inserisci nome e telefono");
      return;
    }
    const confirmBtn = sheet.querySelector("#ctConfirm");
    confirmBtn.disabled = true;
    confirmBtn.textContent = "Aggiungo...";
    await addManualContact(name, phone);
    state.showAddContact = false;
    render();
    flashToast("Cliente aggiunto alla rubrica");
  };

  return overlay;
}

function renderOwnerView(main){
  if(!state.ownerUnlocked){
    renderPinScreen(main);
    return;
  }

  // mark all as seen once owner opens the dashboard
  const hadUnseen = unseenCount() > 0;

  const stats = document.createElement("div");
  stats.className = "owner-stats";
  const todayKey = dateKey(new Date());
  const todayCount = state.bookings.filter(b=>b.date===todayKey).length;
  const totalCount = state.bookings.length;
  const todayRevenue = state.bookings.filter(b=>b.date===todayKey)
    .reduce((sum,b)=>{ const s=ALL_SERVICES.find(x=>x.id===b.serviceId); return sum + (s?s.price:0); },0);
  stats.innerHTML = `
    <div class="stat-card"><div class="stat-num">${todayCount}</div><div class="stat-label">OGGI</div></div>
    <div class="stat-card"><div class="stat-num">${totalCount}</div><div class="stat-label">TOTALI</div></div>
    <div class="stat-card"><div class="stat-num">${fmtEUR(todayRevenue)}</div><div class="stat-label">INCASSO OGGI</div></div>
  `;
  main.appendChild(stats);

  main.appendChild(renderBreaksSection());
  main.appendChild(renderRubricaSection());

  const label = document.createElement("div");
  label.className = "section-label";
  label.textContent = "PRENOTAZIONI";
  main.appendChild(label);

  if(state.bookings.length===0){
    const empty = document.createElement("div");
    empty.className = "empty-state";
    empty.innerHTML = `<div class="e-icon">🗓️</div>Nessuna prenotazione ancora.<br>Le nuove prenotazioni dei clienti<br>appariranno qui in tempo reale.`;
    main.appendChild(empty);
  } else {
    const sorted = [...state.bookings].sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
    sorted.forEach(b=>{
      const svc = ALL_SERVICES.find(s=>s.id===b.serviceId);
      const dObj = new Date(b.date+"T00:00:00");
      const card = document.createElement("div");
      card.className = "booking-card" + (!b.seenByOwner ? " new" : "");
      card.innerHTML = `
        <div class="b-top">
          <div>
            <div class="b-date">${DOW[dObj.getDay()]} ${formatDateLong(dObj)}</div>
            <div class="b-time">${b.time}</div>
          </div>
          ${!b.seenByOwner ? '<div class="badge-new">NUOVA</div>' : ''}
        </div>
        <div class="b-service">${svc.name} · ${fmtEUR(svc.price)} · ${svc.dur} min</div>
        ${b.createdAt ? `<div class="b-created">Prenotato il ${formatCreatedAt(b.createdAt)}</div>` : ''}
        <div class="b-client">
          <div>
            <div class="b-name">${b.name}</div>
            <div class="b-phone">${b.phone}</div>
          </div>
          <a class="icon-btn" target="_blank" rel="noopener" href="${'https://wa.me/'+toWhatsappNumber(b.phone)+'?text='+encodeURIComponent('Ciao '+b.name+'! Ti confermiamo la prenotazione per '+svc.name+' il '+formatDateLong(dObj)+' alle '+b.time+' da HairEvolution. Ti aspettiamo!')}">WhatsApp</a>
        </div>
      `;
      main.appendChild(card);
    });
  }

  if(hadUnseen){
    setTimeout(()=>{
      state.bookings.forEach(b=>b.seenByOwner=true);
      syncBookings();
      render();
    }, 900);
  }

  if(state.bookings.length > 0){
    const resetWrap = document.createElement("div");
    resetWrap.style.textAlign = "center";
    resetWrap.style.marginTop = "18px";
    const resetBtn = document.createElement("button");
    resetBtn.className = "link-btn";
    resetBtn.textContent = "Azzera tutte le prenotazioni";
    resetBtn.onclick = async () => {
      state.bookings = [];
      await syncBookings();
      render();
      flashToast("Prenotazioni azzerate");
    };
    resetWrap.appendChild(resetBtn);
    main.appendChild(resetWrap);
  }

  const versionWrap = document.createElement("div");
  versionWrap.style.textAlign = "center";
  versionWrap.style.marginTop = "10px";
  const versionBtn = document.createElement("button");
  versionBtn.className = "link-btn";
  versionBtn.textContent = `📋 Cronologia versione (v${APP_VERSION})`;
  versionBtn.onclick = () => { state.showChangelog = true; render(); };
  versionWrap.appendChild(versionBtn);
  main.appendChild(versionWrap);

  const devTestWrap = document.createElement("div");
  devTestWrap.style.textAlign = "center";
  devTestWrap.style.marginTop = "10px";
  const devTestBtn = document.createElement("a");
  devTestBtn.className = "link-btn";
  devTestBtn.target = "_blank";
  devTestBtn.rel = "noopener";
  devTestBtn.textContent = "🧪 Invia messaggio di test (sviluppatore)";
  devTestBtn.href = `https://wa.me/${SHOP.devPhone}?text=${encodeURIComponent("Test HairEvolution BarberApp v"+APP_VERSION+" — tutto ok!")}`;
  devTestWrap.appendChild(devTestBtn);
  main.appendChild(devTestWrap);
}

function renderChangelogSheet(){
  const overlay = document.createElement("div");
  overlay.className = "sheet-overlay";
  overlay.onclick = (e) => { if(e.target===overlay){ state.showChangelog=false; render(); } };

  const sheet = document.createElement("div");
  sheet.className = "sheet";

  const summaryHTML = APP_SUMMARY.map(s => `
    <div class="summary-entry">
      <div class="summary-title">${s.title}</div>
      <div class="summary-text">${s.text}</div>
    </div>
  `).join("");

  const entriesHTML = CHANGELOG.map(entry => `
    <div class="changelog-entry">
      <div class="changelog-version">v${entry.version} <span class="changelog-date">${entry.date}</span></div>
      ${entry.summary ? `<div class="changelog-summary">${entry.summary}</div>` : ""}
      <ul class="changelog-list">
        ${entry.changes.map(c => `<li>${c}</li>`).join("")}
      </ul>
    </div>
  `).join("");

  sheet.innerHTML = `
    <h3>Cronologia versione</h3>
    <div class="sheet-sub">Versione attuale: v${APP_VERSION} — aggiornata al ${APP_VERSION_DATE}</div>
    <div class="changelog-scroll">
      <div class="section-label" style="margin-top:0;">COME FUNZIONA LA PRENOTAZIONE</div>
      ${summaryHTML}
      <div class="section-label">CRONOLOGIA MODIFICHE</div>
      ${entriesHTML}
    </div>
    <div class="sheet-actions">
      <button class="btn-primary" id="closeChangelog" style="flex:1;">Chiudi</button>
    </div>
  `;
  overlay.appendChild(sheet);

  sheet.querySelector("#closeChangelog").onclick = () => { state.showChangelog=false; render(); };

  return overlay;
}

function renderPinScreen(main){
  const wrap = document.createElement("div");
  wrap.className = "pin-screen";
  wrap.innerHTML = `
    <div class="lock">🔒</div>
    <h3>Area titolare</h3>
    <p>Accesso riservato — inserisci il PIN per vedere<br>nomi e contatti dei clienti prenotati.</p>
    <input class="pin-input" id="pinField" type="password" maxlength="4" inputmode="numeric" placeholder="••••" />
    <div>
      <button class="btn-primary" id="pinGo">Entra</button>
    </div>
    <div class="pin-hint">${state.pinError ? "PIN errato, riprova." : ""}</div>
  `;
  main.appendChild(wrap);
  const field = wrap.querySelector("#pinField");
  field.focus();
  const tryUnlock = () => {
    if(field.value === "2210"){
      state.ownerUnlocked = true;
      state.pinError = false;
    } else {
      state.pinError = true;
    }
    render();
  };
  wrap.querySelector("#pinGo").onclick = tryUnlock;
  field.onkeydown = (e) => { if(e.key==="Enter") tryUnlock(); };
}

render();
fetchBookings(); // aggiorna con i dati reali dal database condiviso, appena disponibili
fetchBreaks();
fetchContacts();
fetchInvited();
</script>
</body>
</html>
